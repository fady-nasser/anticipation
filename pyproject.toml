[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anticipation"
version = "0.1.0"
description = "Anticipation in Football: From Predicting Opponents to Understanding Teammates (SSAC 2027)"
readme = "README.md"
authors = [{ name = "Fady Nasser", email = "fadynasseraziz@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
